<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:"QZ Display";src:url("fonts/qz-display-900.woff2") format("woff2");font-weight:800 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:linear-gradient(115deg,#20150B 0%,#2A1C0F 62%,#33220f 100%);font-family:"QZ Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.dog{position:absolute;right:-40px;top:-56px;width:720px;-webkit-mask-image:radial-gradient(ellipse 58% 56% at 54% 46%,#000 48%,transparent 76%);mask-image:radial-gradient(ellipse 58% 56% at 54% 46%,#000 48%,transparent 76%)}
.tag{position:absolute;left:76px;top:92px;display:flex;align-items:center;gap:14px;color:rgba(255,244,224,.82);font-size:17px;letter-spacing:.22em}
.tag i{width:16px;height:16px;background:#FFE04D;border-radius:3px;transform:rotate(-6deg)}
.title{position:absolute;left:72px;top:168px;color:#FFFDF6;font-weight:900;font-size:120px;line-height:1.05;letter-spacing:-.01em}
.title .en{font-size:92px;display:block;letter-spacing:-.03em}
.title .hl{color:#FFE04D}
.name{position:absolute;left:76px;bottom:96px;color:rgba(255,244,224,.92);font-size:23px;letter-spacing:.14em}
.name b{color:#FFE04D}
.stats{position:absolute;left:76px;bottom:40px;color:rgba(255,244,224,.6);font-size:17px;letter-spacing:.05em;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<img class="dog" src="assets/pup-poster.jpg" alt="">
<div class="tag"><i></i>刚刚好，就很好。</div>
<div class="title">起醉<span class="en">makes <span class="hl">增长。</span></span></div>
<div class="name">姚腾腾 · 花名 <b>起醉</b> · TengSeven</div>
<div class="stats">10+ 年宠物行业电商操盘 · 4亿+ 操盘规模 · 25 倍增长 · 单日 GMV 2500万+</div>
</body>
</html>
